# Active via: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Under this profile, security.SecurityConfig registers a symmetric-key JwtDecoder instead of the
# real issuer-based one - spring.security.oauth2.resourceserver.jwt.issuer-uri is not read at all
# in this profile, so it is deliberately left unset here. This lets a developer run the API
# locally and hand-craft a bearer token without standing up a real identity provider - see
# README.md's "Local Development" section for how to mint one against the published local-only
# key ("local-only-test-signing-key-not-a-real-secret-32bytes-minimum", HS256). Never used outside
# this profile, and not a real credential.
