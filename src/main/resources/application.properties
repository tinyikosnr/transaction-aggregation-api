spring.application.name=transaction-aggregation-api

# JWT resource-server configuration (SAD 36, TDS 41). JWT_ISSUER_URI has no default value here:
# an unset environment variable must fail application startup, not silently accept tokens from
# any/no issuer. Not resolved at all under the "local" profile, which supplies its own
# symmetric-key JwtDecoder instead - see security.SecurityConfig.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
app.security.expected-audience=${JWT_EXPECTED_AUDIENCE:transaction-aggregation-api}

# OpenAPI/Swagger UI exposure (SAD 35.9, feature/openapi-documentation): disabled by default/
# production. No documented production need for schema discovery exists (no portal, no pipeline,
# no external consumer), so the conservative reading disables both here; see
# application-local.properties for the local-development override.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Observability (feature/observability, SAD 38): a narrow allow-list, never a wildcard. health was
# already exposed; prometheus/metrics are the FR-13/SAD-38.2 metrics endpoints, protected by
# OPERATIONS_READ (security.SecurityConfig) - see README.md for the full endpoint/security table.
# Available in all profiles (unlike the local-only OpenAPI docs): production scraping is the real
# use case for a metrics endpoint, not a developer convenience.
management.endpoints.web.exposure.include=health,prometheus,metrics

# Health/readiness (feature/health-readiness, SAD 38.4): Spring Boot 4.1 already enables the
# liveness/readiness probe groups and their /actuator/health/{liveness,readiness} paths by
# default (management.endpoint.health.probes.enabled is not set - confirmed empirically it is not
# needed). The one gap the framework's own default leaves open is that "db" is not part of the
# readiness group by default (confirmed empirically via a real outage test) - readiness must
# reflect PostgreSQL availability ("Readiness should consider critical dependencies such as
# PostgreSQL"), liveness must not. No explicit liveness include is set - livenessState-only is
# already the correct default.
management.endpoint.health.group.readiness.include=readinessState,db

# Spring Boot 4.1 evaluates @ConditionalOnEnabledMetricsExport against
# management.defaults.metrics.export.enabled, which resolves to false with nothing else set -
# confirmed empirically via the autoconfiguration condition-evaluation report
# (PrometheusMetricsExportAutoConfiguration "Did not match": management.defaults.metrics.export.enabled
# is considered false), a genuine behaviour difference from the plan's original assumption that
# Prometheus export was enabled by default once the dependency is present. Opting in narrowly, per
# registry - not management.defaults.metrics.export.enabled=true - so no other registry
# (otlp/datadog/graphite/...) is silently enabled by the same switch.
management.prometheus.metrics.export.enabled=true

# Structured logging (feature/structured-logging, ADR-011, SAD 37): Spring Boot 4.1's native ECS
# structured-logging formatter, zero third-party dependency (no logstash-logback-encoder, no
# logback-spring.xml - confirmed empirically that Boot's own org.springframework.boot.logging.logback.*
# formatters ship inside spring-boot-4.1.0.jar itself). ECS was chosen over the also-native
# "logstash" preset because it natively supplies service.name (from spring.application.name,
# below) and separates exception.type/exception.message from the stack trace
# (error.type/error.message/error.stack_trace), most directly satisfying SAD 37.1's field list.
# logging.structured.json.context.include is deliberately NOT set here - Boot 4.1 already includes
# MDC/context data (this application's correlationId key included) by default; confirmed
# empirically via a real request before this property was ever set explicitly, both with and
# without the property present. Setting it would only restate an already-active default.
# "environment" is deliberately omitted (no logging.structured.ecs.service.environment): no real
# deployment-supplied environment property exists anywhere in this project today, and the active
# Spring profile (e.g. "local") is a different concept (JwtDecoder/OpenAPI exposure), not a
# deployment-tier label - misusing it here would misrepresent the field.
logging.structured.format.console=ecs
